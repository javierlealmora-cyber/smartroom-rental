name: Deploy Edge Functions

on:
  push:
    branches: 
      - develop
      - main
    paths:
      - 'supabase/functions/**'
      - '!supabase/functions/README.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      functions:
        description: 'Functions to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  NODE_VERSION: '20'

jobs:
  detect-changes:
    name: Detect Changed Functions
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.detect.outputs.functions }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed functions
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.functions }}" != "all" ]; then
            # Manual trigger with specific functions
            FUNCTIONS="${{ github.event.inputs.functions }}"
            echo "functions=$FUNCTIONS" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            # Auto-detect changed functions
            CHANGED_FUNCTIONS=$(git diff --name-only HEAD~1 HEAD | grep '^supabase/functions/' | cut -d'/' -f3 | sort -u | tr '\n' ',' | sed 's/,$//')
            
            if [ -z "$CHANGED_FUNCTIONS" ]; then
              # If no specific changes, deploy all
              ALL_FUNCTIONS=$(ls -d supabase/functions/*/ 2>/dev/null | xargs -n 1 basename | grep -v '^_' | tr '\n' ',' | sed 's/,$//')
              echo "functions=$ALL_FUNCTIONS" >> $GITHUB_OUTPUT
              echo "has-changes=true" >> $GITHUB_OUTPUT
            else
              echo "functions=$CHANGED_FUNCTIONS" >> $GITHUB_OUTPUT
              echo "has-changes=true" >> $GITHUB_OUTPUT
            fi
          fi
          
          echo "📦 Functions to deploy: $(cat $GITHUB_OUTPUT | grep functions | cut -d'=' -f2)"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.environment == 'staging' && needs.detect-changes.outputs.has-changes == 'true'
    
    environment:
      name: staging
      url: https://staging.smartroomrentalplatform.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Staging
        run: |
          echo "🚀 Deploying Edge Functions to STAGING..."
          
          FUNCTIONS="${{ needs.detect-changes.outputs.functions }}"
          IFS=',' read -ra FUNC_ARRAY <<< "$FUNCTIONS"
          
          for func in "${FUNC_ARRAY[@]}"; do
            func=$(echo "$func" | xargs) # trim whitespace
            
            if [ -d "supabase/functions/$func" ]; then
              echo "📦 Deploying function: $func"
              
              supabase functions deploy "$func" \
                --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }} \
                --no-verify-jwt false
              
              if [ $? -eq 0 ]; then
                echo "✅ Successfully deployed: $func"
              else
                echo "❌ Failed to deploy: $func"
                exit 1
              fi
            else
              echo "⚠️ Function directory not found: $func"
            fi
          done
          
          echo "✅ All Edge Functions deployed to STAGING"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployments
        run: |
          echo "🔍 Verifying Edge Function deployments..."
          
          FUNCTIONS="${{ needs.detect-changes.outputs.functions }}"
          IFS=',' read -ra FUNC_ARRAY <<< "$FUNCTIONS"
          
          for func in "${FUNC_ARRAY[@]}"; do
            func=$(echo "$func" | xargs)
            
            # Test function endpoint
            FUNCTION_URL="https://${{ secrets.STAGING_SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/$func"
            
            echo "Testing: $FUNCTION_URL"
            
            # Simple health check (adjust based on your function's expected behavior)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FUNCTION_URL" -H "Authorization: Bearer ${{ secrets.STAGING_SUPABASE_ANON_KEY }}" || echo "000")
            
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ Function $func is responding (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Function $func might not be accessible"
            fi
          done

      - name: Create deployment summary
        run: |
          echo "## 🚀 Edge Functions Deployment Summary (STAGING)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Functions Deployed**: ${{ needs.detect-changes.outputs.functions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project**: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.environment == 'production' && needs.detect-changes.outputs.has-changes == 'true'
    
    environment:
      name: production
      url: https://smartroomrentalplatform.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Production
        run: |
          echo "🚀 Deploying Edge Functions to PRODUCTION..."
          
          FUNCTIONS="${{ needs.detect-changes.outputs.functions }}"
          IFS=',' read -ra FUNC_ARRAY <<< "$FUNCTIONS"
          
          for func in "${FUNC_ARRAY[@]}"; do
            func=$(echo "$func" | xargs)
            
            if [ -d "supabase/functions/$func" ]; then
              echo "📦 Deploying function: $func"
              
              supabase functions deploy "$func" \
                --project-ref ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }} \
                --no-verify-jwt false
              
              if [ $? -eq 0 ]; then
                echo "✅ Successfully deployed: $func"
              else
                echo "❌ Failed to deploy: $func"
                exit 1
              fi
            else
              echo "⚠️ Function directory not found: $func"
            fi
          done
          
          echo "✅ All Edge Functions deployed to PRODUCTION"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployments
        run: |
          echo "🔍 Verifying Edge Function deployments..."
          
          FUNCTIONS="${{ needs.detect-changes.outputs.functions }}"
          IFS=',' read -ra FUNC_ARRAY <<< "$FUNCTIONS"
          
          for func in "${FUNC_ARRAY[@]}"; do
            func=$(echo "$func" | xargs)
            
            FUNCTION_URL="https://${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/$func"
            
            echo "Testing: $FUNCTION_URL"
            
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FUNCTION_URL" -H "Authorization: Bearer ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}" || echo "000")
            
            if [ "$HTTP_CODE" != "000" ]; then
              echo "✅ Function $func is responding (HTTP $HTTP_CODE)"
            else
              echo "⚠️ Function $func might not be accessible"
            fi
          done

      - name: Create deployment summary
        run: |
          echo "## 🚀 Edge Functions Deployment Summary (PRODUCTION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Production" >> $GITHUB_STEP_SUMMARY
          echo "**Functions Deployed**: ${{ needs.detect-changes.outputs.functions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project**: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-staging, deploy-production]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ] || [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Edge Functions deployed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Edge Functions deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          channel: '#deployments'
          text: |
            ${{ steps.status.outputs.message }}
            
            **Environment**: ${{ needs.detect-changes.outputs.environment }}
            **Functions**: ${{ needs.detect-changes.outputs.functions }}
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
