name: E2E Tests

on:
  push:
    branches: [ main, develop, staging ]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.*'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'playwright.config.*'
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - accessibility
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
          - preview
      parallel:
        description: 'Run tests in parallel'
        required: false
        default: true
        type: boolean
      retry:
        description: 'Retry failed tests'
        required: false
        default: 2
        type: number

env:
  NODE_VERSION: '20'
  PLAYWRIGHT_BROWSERS: 'chromium firefox webkit'

jobs:
  # Job 1: Setup and Build
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    
    outputs:
      build-url: ${{ steps.deploy.outputs.url }}
      test-environment: ${{ steps.env.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine test environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "environment=preview" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "staging" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build
          path: dist/
          retention-days: 1

      - name: Deploy preview for PR
        if: github.event_name == 'pull_request'
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          alias-domains: |
            e2e-${{ github.event.number }}.smartroom-rental.vercel.app

  # Job 2: Smoke Tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: setup
    if: |
      github.event.inputs.test_suite == 'all' || 
      github.event.inputs.test_suite == 'smoke' || 
      github.event.inputs.test_suite == ''
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run smoke tests
        run: npx playwright test --project=${{ matrix.browser }} --grep @smoke
        env:
          CI: true
          BASE_URL: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Job 3: Regression Tests
  regression-tests:
    name: Regression Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: setup
    if: |
      github.event.inputs.test_suite == 'all' || 
      github.event.inputs.test_suite == 'regression'
    
    strategy:
      matrix:
        browser: [chromium, firefox]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run regression tests
        run: npx playwright test --project=${{ matrix.browser }} --grep @regression
        env:
          CI: true
          BASE_URL: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}

      - name: Upload regression test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Job 4: Accessibility Tests
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: setup
    if: |
      github.event.inputs.test_suite == 'all' || 
      github.event.inputs.test_suite == 'accessibility'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install accessibility tools
        run: npm install -g axe-core

      - name: Run accessibility tests
        run: npx playwright test --project=chromium --grep @accessibility
        env:
          CI: true
          BASE_URL: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-test-results
          path: |
            playwright-report/
            test-results/
            accessibility-report/
          retention-days: 7

  # Job 5: Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: setup
    if: |
      github.event.inputs.test_suite == 'all' || 
      github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run performance tests
        run: npx playwright test --project=chromium --grep @performance
        env:
          CI: true
          BASE_URL: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}

      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            playwright-report/
            test-results/
            lighthouse-report/
          retention-days: 7

  # Job 6: Visual Regression Tests
  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: setup
    if: |
      github.event.inputs.test_suite == 'all' || 
      github.event.inputs.test_suite == 'regression'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: e2e-build
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npx playwright test --project=chromium --grep @visual
        env:
          CI: true
          BASE_URL: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}

      - name: Upload visual regression results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-results
          path: |
            playwright-report/
            test-results/
            visual-comparison/
          retention-days: 7

  # Job 7: Test Results Summary
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, accessibility-tests, performance-tests, visual-regression]
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: results/

      - name: Generate test report
        id: report
        run: |
          echo "📊 Generating E2E test report..."
          
          # Count test results
          SMOKE_RESULT="${{ needs.smoke-tests.result }}"
          REGRESSION_RESULT="${{ needs.regression-tests.result }}"
          ACCESSIBILITY_RESULT="${{ needs.accessibility-tests.result }}"
          PERFORMANCE_RESULT="${{ needs.performance-tests.result }}"
          VISUAL_RESULT="${{ needs.visual-regression.result }}"
          
          # Create summary
          echo "## 🧪 E2E Test Results Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "| Test Suite | Status | Browsers |" >> test-summary.md
          echo "|------------|--------|----------|" >> test-summary.md
          echo "| 🚪 Smoke Tests | $SMOKE_RESULT | Chromium, Firefox, WebKit |" >> test-summary.md
          echo "| 🔄 Regression | $REGRESSION_RESULT | Chromium, Firefox |" >> test-summary.md
          echo "| ♿ Accessibility | $ACCESSIBILITY_RESULT | Chromium |" >> test-summary.md
          echo "| ⚡ Performance | $PERFORMANCE_RESULT | Chromium |" >> test-summary.md
          echo "| 👁️ Visual | $VISUAL_RESULT | Chromium |" >> test-summary.md
          echo "" >> test-summary.md
          
          # Add environment info
          echo "**Environment**: ${{ needs.setup.outputs.test-environment }}" >> test-summary.md
          echo "**Base URL**: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}" >> test-summary.md
          echo "**Test Suite**: ${{ github.event.inputs.test_suite || 'all' }}" >> test-summary.md
          
          # Add download links
          echo "" >> test-summary.md
          echo "### 📥 Test Artifacts" >> test-summary.md
          echo "- Smoke test results" >> test-summary.md
          echo "- Regression test results" >> test-summary.md
          echo "- Accessibility test results" >> test-summary.md
          echo "- Performance test results" >> test-summary.md
          echo "- Visual regression results" >> test-summary.md
          
          cat test-summary.md

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            
            const { owner, repo } = context.repo;
            const pr_number = context.payload.pull_request.number;
            
            github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: summary
            });

      - name: Upload test summary
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-summary
          path: test-summary.md
          retention-days: 30

  # Job 8: Notify on Failure
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, accessibility-tests, performance-tests]
    if: failure()
    
    steps:
      - name: Determine failed tests
        id: failed
        run: |
          FAILED_TESTS=""
          
          if [ "${{ needs.smoke-tests.result }}" == "failure" ]; then
            FAILED_TESTS="$FAILED_TESTS Smoke,"
          fi
          if [ "${{ needs.regression-tests.result }}" == "failure" ]; then
            FAILED_TESTS="$FAILED_TESTS Regression,"
          fi
          if [ "${{ needs.accessibility-tests.result }}" == "failure" ]; then
            FAILED_TESTS="$FAILED_TESTS Accessibility,"
          fi
          if [ "${{ needs.performance-tests.result }}" == "failure" ]; then
            FAILED_TESTS="$FAILED_TESTS Performance,"
          fi
          if [ "${{ needs.visual-regression.result }}" == "failure" ]; then
            FAILED_TESTS="$FAILED_TESTS Visual,"
          fi
          
          echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#testing'
          text: |
            ❌ E2E Tests Failed
            
            **Environment**: ${{ needs.setup.outputs.test-environment }}
            **Failed Tests**: ${{ steps.failed.outputs.failed_tests }}
            **Branch**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            
            **Workflow URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Issue for failed tests
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            github.rest.issues.create({
              owner,
              repo,
              title: `❌ E2E Tests Failed - ${{ needs.setup.outputs.test-environment }}`,
              body: `
            ## E2E Test Failure
            
            **Environment**: ${{ needs.setup.outputs.test-environment }}
            **Base URL**: ${{ needs.setup.outputs.build-url || 'https://staging.smartroomrentalplatform.com' }}
            **Branch**: ${{ github.ref_name }}
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            **Time**: ${new Date().toISOString()}
            
            **Failed Test Suites**: ${{ steps.failed.outputs.failed_tests }}
            
            **Workflow URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            **Next Steps**:
            1. Review the failed test results
            2. Check the test artifacts for detailed error information
            3. Fix the identified issues
            4. Re-run the tests
            
            ---
            *This issue was automatically created by the E2E test workflow.*
            `,
              labels: ['bug', 'e2e-tests', 'testing', 'needs-triage']
            });

  # Job 9: Cleanup
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [setup, smoke-tests, regression-tests, accessibility-tests, performance-tests, visual-regression]
    if: always() && github.event_name == 'pull_request'
    
    steps:
      - name: Cleanup preview deployment
        if: github.event_name == 'pull_request'
        run: |
          echo "🧹 Cleaning up preview deployment..."
          
          # This would cleanup the preview deployment
          echo "✅ Preview deployment cleaned up"
