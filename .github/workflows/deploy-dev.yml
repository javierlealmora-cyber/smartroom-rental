name: Deploy to Development

on:
  push:
    branches: [ develop ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.*'
      - '.env.*'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  VERCEL_ENV: development
  SUPABASE_ENV: development

jobs:
  # Job 1: Test and Build
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    
    outputs:
      build-success: ${{ steps.build.outcome }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        continue-on-error: true
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build application
        id: build
        run: npm run build:dev
        env:
          NODE_ENV: development
          VITE_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dev-build
          path: dist/
          retention-days: 1

  # Job 2: Deploy to Vercel Development
  deploy:
    name: Deploy to Vercel Dev
    runs-on: ubuntu-latest
    needs: test-and-build
    if: needs.test-and-build.outputs.build-success == 'success' || github.event.inputs.force_deploy == 'true'
    
    environment:
      name: development
      url: https://dev.smartroom-rental.vercel.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dev-build
          path: dist/

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: |
            dev.smartroom-rental.vercel.app

      - name: Run smoke tests against dev
        continue-on-error: true
        run: |
          echo "🧪 Running smoke tests against dev environment..."
          sleep 30 # Wait for deployment to be ready
          
          # Basic health check
          curl -f https://dev.smartroom-rental.vercel.app/ || echo "⚠️ Health check failed"
          echo "✅ Dev environment deployment completed"


  # Job 3: Database Updates (if needed)
  database-update:
    name: Update Database
    runs-on: ubuntu-latest
    needs: test-and-build
    if: |
      contains(github.event.head_commit.message, 'migration') || 
      contains(github.event.head_commit.message, 'database') ||
      github.event.inputs.force_deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        run: |
          echo "🗄️ Applying database migrations to dev..."
          
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "Found migration files, applying to dev..."
            npx supabase db push --project-ref $SUPABASE_PROJECT_REF
            echo "✅ Migrations applied successfully"
          else
            echo "No migration files found"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}

      - name: Apply static data
        run: |
          echo "📊 Applying static data to dev..."
          
          if [ -d "supabase/static-data" ]; then
            echo "Found static data files, applying to dev..."
            
            # Apply each static data file
            for file in supabase/static-data/*.sql; do
              if [ -f "$file" ]; then
                echo "Applying $file"
                # This would need to be implemented with actual Supabase CLI commands
                # npx supabase db execute --file $file --linked
              fi
            done
          else
            echo "No static data files found"
          fi

  # Job 4: Notify Team
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy, database-update]
    if: always()
    
    steps:
      - name: Get deployment status
        id: status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Development deployment successful" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Development deployment failed" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          channel: '#deployments'
          text: |
            ${{ steps.status.outputs.message }}
            
            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            
            **Environment**: Development
            **URL**: https://dev.smartroom-rental.vercel.app
            
            **Changes**: ${{ github.event.head_commit.message }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Development Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://dev.smartroom-rental.vercel.app" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
