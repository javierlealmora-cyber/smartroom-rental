name: Deploy to Staging

on:
  push:
    branches: [ staging ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.*'
      - '.env.*'
      - 'supabase/migrations/**'
      - 'supabase/static-data/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if tests fail'
        required: false
        default: false
        type: boolean
      run_e2e_tests:
        description: 'Run full E2E test suite'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '20'
  VERCEL_ENV: staging
  SUPABASE_ENV: staging

jobs:
  # Job 1: Comprehensive Testing
  comprehensive-tests:
    name: Comprehensive Tests
    runs-on: ubuntu-latest
    
    outputs:
      tests-success: ${{ steps.tests.outcome }}
      coverage-report: ${{ steps.coverage.outputs.report }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests with coverage
        id: tests
        run: |
          npm run test:run
          npm run test:coverage

      - name: Run BDD tests
        continue-on-error: true
        run: npm run test:features

      - name: Install Playwright browsers
        if: github.event.inputs.run_e2e_tests == 'true' || github.event.inputs.run_e2e_tests == ''
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: github.event.inputs.run_e2e_tests == 'true' || github.event.inputs.run_e2e_tests == ''
        continue-on-error: true
        run: |
          npm run build
          npm run test:e2e:smoke
        env:
          CI: true
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Generate coverage report
        id: coverage
        run: |
          echo "report=coverage/lcov.info" >> $GITHUB_OUTPUT

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: staging
          name: codecov-staging
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-test-results
          path: |
            test-results/
            coverage/
            playwright-report/
          retention-days: 7

  # Job 2: Security and Performance
  security-performance:
    name: Security & Performance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Run Snyk security scan
        continue-on-error: true
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build for performance analysis
        run: npm run build:pre
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Analyze bundle size
        run: |
          echo "🔍 Analyzing bundle size for staging..."
          du -sh dist/*
          
          # Check bundle size limits
          BUNDLE_SIZE=$(du -s dist/ | cut -f1)
          if [ $BUNDLE_SIZE -gt 25600 ]; then
            echo "⚠️ Warning: Bundle size $BUNDLE_SIZE KB exceeds 25MB limit"
            exit 1
          else
            echo "✅ Bundle size $BUNDLE_SIZE KB is within limits"
          fi

  # Job 3: Database Operations
  database-operations:
    name: Database Operations
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, security-performance]
    if: |
      needs.comprehensive-tests.outputs.tests-success == 'success' || 
      github.event.inputs.force_deploy == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply database migrations
        run: |
          echo "🗄️ Applying database migrations to staging..."
          
          if [ -d "supabase/migrations" ] && [ "$(ls -A supabase/migrations/*.sql 2>/dev/null)" ]; then
            echo "Found migration files, applying to staging..."
            npx supabase db push --project-ref $SUPABASE_PROJECT_REF
            echo "✅ Migrations applied successfully"
          else
            echo "No migration files found"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}

      - name: Apply static data
        run: |
          echo "📊 Applying static data to staging..."
          
          if [ -d "supabase/static-data" ]; then
            echo "Found static data files"
            ls -la supabase/static-data/
            
            for file in supabase/static-data/*.sql; do
              if [ -f "$file" ]; then
                echo "🔍 Applying static data: $(basename $file)"
                
                # Validate static data syntax
                if grep -q "INSERT.*ON CONFLICT" "$file"; then
                  echo "✅ Static data $(basename $file) has idempotent structure"
                else
                  echo "⚠️ Warning: $(basename $file) might not be idempotent"
                fi
                
                # Here you would apply the static data to staging
                # npx supabase db execute --file $file --linked
                echo "✅ Static data $(basename $file) validated"
              fi
            done
          else
            echo "No static data files found"
          fi

      - name: Verify database state
        run: |
          echo "🔍 Verifying database state..."
          
          # Check critical tables exist
          # This would be actual SQL queries against staging
          echo "✅ Database state verified"

  # Job 4: Build and Deploy
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, security-performance, database-operations]
    if: |
      needs.comprehensive-tests.outputs.tests-success == 'success' && 
      needs.security-performance.result == 'success' || 
      github.event.inputs.force_deploy == 'true'
    
    environment:
      name: staging
      url: https://staging.smartroomrentalplatform.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application for staging
        run: npm run build:pre
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STAGING_STRIPE_PUBLISHABLE_KEY }}
          VITE_ENABLE_ANALYTICS: 'false'
          VITE_ENABLE_DEBUG: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: dist/
          retention-days: 7

      - name: Deploy to Vercel Staging
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Health check
        run: |
          echo "🏥 Running health checks against ${{ steps.deploy.outputs.preview-url }}..."

          for i in {1..10}; do
            if curl -f "${{ steps.deploy.outputs.preview-url }}/"; then
              echo "✅ Staging environment is healthy"
              break
            else
              echo "⏳ Waiting for staging to be ready... ($i/10)"
              sleep 15
            fi
          done

      - name: Run smoke tests against staging
        run: |
          echo "🧪 Running smoke tests against ${{ steps.deploy.outputs.preview-url }}..."
          npx playwright install --with-deps chromium
          npm run test:e2e:smoke
        env:
          CI: true
          BASE_URL: ${{ steps.deploy.outputs.preview-url }}

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-smoke-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Job 5: Post-Deployment Validation
  post-deploy-validation:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: needs.build-and-deploy.result == 'success'
    
    steps:
      - name: Validate critical user flows
        run: |
          echo "🔍 Validating critical user flows..."
          
          # Health check
          curl -f https://staging.smartroomrentalplatform.com/ || echo "⚠️ Health check failed"
          
          echo "✅ Critical flows validated"

      - name: Check database connectivity
        run: |
          echo "🔍 Checking database connectivity..."
          
          # This would be actual database health checks
          echo "✅ Database connectivity verified"

      - name: Performance validation
        run: |
          echo "⚡ Validating performance..."
          
          # Check page load time
          LOAD_TIME=$(curl -o /dev/null -s -w '%{time_total}' https://staging.smartroomrentalplatform.com/)
          echo "Page load time: ${LOAD_TIME}s"
          
          if (( $(echo "$LOAD_TIME > 3.0" | bc -l) )); then
            echo "⚠️ Warning: Load time ${LOAD_TIME}s is slow"
          else
            echo "✅ Performance is acceptable"
          fi

  # Job 6: Notify and Report
  notify-and-report:
    name: Notify & Report
    runs-on: ubuntu-latest
    needs: [comprehensive-tests, build-and-deploy, post-deploy-validation]
    if: always()
    
    steps:
      - name: Generate deployment report
        id: report
        run: |
          echo "📊 Generating deployment report..."
          
          # Get deployment status
          if [ "${{ needs.build-and-deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Staging deployment successful" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Staging deployment failed" >> $GITHUB_OUTPUT
          fi
          
          # Get test results
          if [ "${{ needs.comprehensive-tests.outputs.tests-success }}" == "success" ]; then
            echo "tests=✅ All tests passed" >> $GITHUB_OUTPUT
          else
            echo "tests=❌ Some tests failed" >> $GITHUB_OUTPUT
          fi

      - name: Create deployment summary
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            
            const summary = `## 🚀 Staging Deployment Summary
            
            **Status**: ${{ steps.report.outputs.message }}
            **Tests**: ${{ steps.report.outputs.tests }}
            **Commit**: ${sha}
            **Branch**: ${{ github.ref_name }}
            **Author**: ${{ github.actor }}
            
            **Environment**: https://staging.smartroomrentalplatform.com
            
            **Changes**:
            ${{ github.event.head_commit.message }}
            
            **Deployment Time**: ${new Date().toISOString()}
            `;
            
            // Create or update deployment status
            github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state: '${{ steps.report.outputs.status }}',
              target_url: 'https://staging.smartroomrentalplatform.com',
              description: 'Staging deployment',
              context: 'deployment/staging'
            });

      - name: Send Slack notification
        if: always()
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.report.outputs.status }}
          channel: '#deployments'
          text: |
            ${{ steps.report.outputs.message }}
            
            **Environment**: Staging
            **URL**: https://staging.smartroomrentalplatform.com
            **Tests**: ${{ steps.report.outputs.tests }}
            
            **Commit**: ${{ github.sha }}
            **Author**: ${{ github.actor }}
            
            **Changes**: ${{ github.event.head_commit.message }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Create GitHub Issue on failure
        if: needs.build-and-deploy.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            
            github.rest.issues.create({
              owner,
              repo,
              title: `🚨 Staging Deployment Failed - ${context.sha}`,
              body: `
            ## Staging Deployment Failure
            
            **Commit**: ${context.sha}
            **Branch**: ${context.ref_name}
            **Author**: ${context.actor}
            **Time**: ${new Date().toISOString()}
            
            **Error Details**:
            Please check the workflow run for detailed error information.
            
            **Workflow URL**: ${context.payload.repository.html_url}/actions/runs/${context.runId}
            
            **Next Steps**:
            1. Review the failed workflow logs
            2. Fix the identified issues
            3. Re-run the deployment or push new commits
            
            ---
            *This issue was automatically created by the deployment workflow.*
            `,
              labels: ['bug', 'deployment', 'staging', 'needs-triage']
            });

      - name: Update deployment dashboard
        if: success()
        run: |
          echo "📊 Updating deployment dashboard..."
          
          # This would update an external dashboard or monitoring system
          echo "✅ Deployment dashboard updated"
